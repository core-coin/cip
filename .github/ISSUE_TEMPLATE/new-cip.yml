name: Propose a CIP
description: Start a new Core Improvement Proposal draft
title: "[CIP] "
labels:
  - cip
  - draft
assignees:
  - rastislavcore
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a new CIP. An editor will assign the CIP number. When you later open a pull request, name the file `cip-ID.md`, replacing `ID` with the assigned number. Keep the proposal title to 44 characters or fewer.

  - type: dropdown
    id: lang
    attributes:
      label: Language
      options:
        - en-US
        - en-GB
        - en-IE
        - en-CA
        - en-AU
        - en-NZ
        - en-ZA
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the category that best fits the proposal.
      multiple: false
      options:
        - core
        - networking
        - interface
        - cbc
        - meta
        - informational
    validations:
      required: true

  - type: input
    id: abstract
    attributes:
      label: Abstract
      description: Summarize the technical issue and proposed solution in about 200 words.
      placeholder: Describe the problem and the proposed solution.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The motivation is crucial for CIPs that aim to change the Core protocol. Clearly explain why the existing protocol specification is inadequate to address the problem the CIP aims to solve. CIP submissions lacking sufficient motivation may be rejected outright.
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Specification
      description: The technical specification should detail the syntax and semantics of any new feature. This section should be detailed enough to allow for competing, interoperable implementations on all current Core platforms.
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: The rationale elaborates on the specification, discussing the motivations behind the design and reasons for specific design decisions. Discuss alternative designs considered and any related work. The rationale may also provide evidence of community consensus and should address significant objections or concerns raised during discussions.
    validations:
      required: true

  - type: textarea
    id: backwards-compatibility
    attributes:
      label: Backwards Compatibility
      description: Describe every backward incompatibility, its severity, and how it will be addressed. Use "Not applicable" if the proposal is fully backward compatible.
    validations:
      required: true

  - type: textarea
    id: test-cases
    attributes:
      label: Test Cases
      description: Test cases for implementation are mandatory for CIPs that affect consensus changes. Other CIPs may choose to include links to relevant test cases, if applicable.
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Implementations should be finalized before any CIP receives "Final" status, but they don't need to be completed before the CIP is accepted. While there's merit in achieving consensus on the specification and rationale before coding, the principle of "rough consensus and running code" remains useful for resolving many API details discussions.
    validations:
      required: false

  - type: textarea
    id: security-considerations
    attributes:
      label: Security Considerations
      description: Explain the security implications and risks of the proposed change. Use "No known security implications" only when appropriate.
    validations:
      required: true

  - type: input
    id: requires
    attributes:
      label: Requires
      description: CIP number(s)
      placeholder: Requires
    validations:
      required: false

  - type: input
    id: replaces
    attributes:
      label: Replaces
      description: CIP number(s)
      placeholder: Replaces
    validations:
      required: false

  - type: input
    id: superseded-by
    attributes:
      label: Superseded by
      description: CIP number(s)
      placeholder: Superseded by
