name: Update Front Matter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: update-front-matter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-front-matter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update front matter in Markdown files
        run: node update_frontmatter.mjs

      - name: Commit changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- cip
          if git diff --staged --quiet; then
            echo "No front matter changes to commit."
            exit 0
          fi
          git commit -m "chore: update front matter tags"
          git push origin HEAD:master

  publish-knowledge:
    needs: update-front-matter
    uses: ./.github/workflows/content-pipeline.yml
    permissions:
      contents: write
      actions: write
