name: CIP linter

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - "cip/**/*.md"
      - "cip/**/*.mdx"
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "README.md"
      - ".github/workflows/markdownlint.yml"
      - ".github/.markdownlint.json"

jobs:
  cip-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: .github/.markdownlint.json
          globs: |
            README.md
            docs/**/*.{md,mdx}
            cip/**/*.{md,mdx}
