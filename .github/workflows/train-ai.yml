name: Prepare CoreAI knowledge

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generated knowledge
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate retrieval corpus
        run: npm run validate:llms

      - name: Upload CoreAI knowledge artifact
        uses: actions/upload-artifact@v7
        with:
          name: coreai-knowledge-${{ github.sha }}
          path: |
            static/llms.txt
            static/llms-full.txt
            static/llms/
          if-no-files-found: error
          retention-days: 30
