name: Publish CIP knowledge

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: publish-cip-knowledge-master
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/markdownlint.yml
    with:
      checkout_ref: master
    permissions:
      contents: read

  build-site:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check site
        run: npm run typecheck

      - name: Build site
        run: npm run build

  generate-llm-files:
    needs: build-site
    uses: ./.github/workflows/generate-llms.yml
    permissions:
      contents: write

  prepare-ai-knowledge:
    needs: generate-llm-files
    uses: ./.github/workflows/train-ai.yml
    permissions:
      contents: write
      actions: write
